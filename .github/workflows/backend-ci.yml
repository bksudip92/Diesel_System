name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diesel
          POSTGRES_PASSWORD: diesel
          POSTGRES_DB: postgres
        ports:
          - '5433:5432'
        options: >-
          --health-cmd "pg_isready -U diesel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://diesel:diesel@localhost:5433/diesel_system_test
      DATABASE_URL: postgresql://diesel:diesel@localhost:5433/diesel_system_test
      JWT_SECRET: ci-only-secret-not-for-production-use-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npx vitest run

  image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Stage 4 will extend this job to push to GHCR and deploy to EC2.
      # For now we only prove the production image builds.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: diesel-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
