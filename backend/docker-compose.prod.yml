# Production-parity stack: caddy edge (auto-HTTPS) → API → Postgres.
#
# Local parity check:
#   docker compose -f docker-compose.prod.yml up --build -d
#   curl -k https://35-193-94-201.sslip.io/health
#   (from the server itself; browsers/phones use https without -k)
#
# On the EC2 instance this same file runs as-is behind ports 80/443.
name: diesel-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diesel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-diesel_system}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-diesel}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host on purpose — only the API talks to it,
    # over the internal Docker network. Learn: least-privilege networking.

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-diesel}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-diesel_system}
      JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-604800}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
